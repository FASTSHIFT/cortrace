name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  format:
    name: clang-format (WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: bash scripts/format.sh --check

  build-test-coverage:
    name: build + test + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr libopencsd-dev

      - name: Configure (coverage + -Werror on)
        run: cmake -S . -B build -DENABLE_COVERAGE=ON -DCORTRACE_WERROR=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Coverage (fails under minimum line threshold)
        run: cmake --build build --target coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/coverage-html
          if-no-files-found: ignore
